<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Under Construction</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #f0f4f8;
            color: #2d3748;
            text-align: center;
            padding: 20px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 16px;
        }
        p {
            font-size: 1.2rem;
            color: #4a5568;
            max-width: 600px;
        }
        .icon {
            font-size: 4rem;
            margin-bottom: 24px;
        }
    </style>
</head>
<body>
    <div class="icon">🚧</div>
    <h1>Website Under Construction</h1>
    <p>We are working hard to build this site. Please come back soon.</p>
</body>
</html>
